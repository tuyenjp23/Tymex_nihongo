name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Kiểm tra kiểu, test, nội dung, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck
      - name: Unit test (gồm test SQL/RLS trên PGlite)
        run: npm test
      - name: Kiểm tra dữ liệu mẫu (nguồn gốc, tham chiếu, trạng thái)
        run: npm run validate:content
      - name: Seed JSON và seed.sql phải khớp bộ sinh nội dung
        run: |
          npm run build:seed
          npm run seed:sql
          git diff --exit-code -- content/seed supabase/seed.sql
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Test trình duyệt (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
